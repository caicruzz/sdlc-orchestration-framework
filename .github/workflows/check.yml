# Runs the same command the Verifier runs (scripts/test.sh: check.sh and every
# scripts/test-*.sh) on Linux and on macOS's /bin/bash 3.2. Lint has no step of
# its own: test.sh runs scripts/lint.sh through test-harness.sh, so both jobs
# install shellcheck. Actions are pinned to a commit SHA (tag in the comment).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
      - name: Test
        run: bash scripts/test.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # scripts/test.sh runs test-harness.sh, whose configured-lint scenario
      # runs scripts/lint.sh, and lint.sh needs shellcheck.
      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck
          fi
      - name: Test (bash 3.2)
        run: /bin/bash scripts/test.sh
